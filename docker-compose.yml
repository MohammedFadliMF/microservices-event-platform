services:
  event-discovery-service:
    build: ./discovery-service
    container_name: event-discovery-service
    ports:
      - "8761:8761"
    expose:
      - "8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 4
    networks:
      - event-network
  event-config-service:
    build: ./config-service
    container_name: event-config-service
    ports:
      - "9999:9999"
    expose:
      - "9999"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 10s
      retries: 4
    depends_on:
      event-discovery-service:
        condition: service_healthy
    networks:
      - event-network
#  event-user-service:
#    build: ./user-service
#    container_name: event-user-service
#    ports:
#      - "8081:8081"
#    expose:
#      - "8081"
#    environment:
#      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
#      - CONFIG_SERVICE_URL=http://event-config-service:9999
#    healthcheck:
