  event-event-service:
    build: ./event-service
    container_name: event-event-service
    ports:
      - "8082:8082"
    expose:
      - "8082"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://localhost:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://localhost:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - EVENT_SERVICE_CLIENT_SECRET=${EVENT_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      retries: 4
    depends_on:
      event-config-service:
        condition: service_healthy
      event-db:
        condition: service_healthy
    networks:
      - event-network
  event-ticket-service:
    build: ./ticket-service
    container_name: event-ticket-service
    ports:
      - "8083:8083"
    expose:
      - "8083"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://localhost:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://localhost:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - TICKET_SERVICE_CLIENT_SECRET=${TICKET_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      retries: 4
    depends_on:
      event-event-service:
        condition: service_healthy
      ticket-db:
        condition: service_healthy
    networks:
      - event-network
  event-payment-service:
    build: ./payment-service
    container_name: event-payment-service
    ports:
      - "8084:8084"
    expose:
      - "8084"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://localhost:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://localhost:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - PAYMENT_SERVICE_CLIENT_SECRET=${PAYMENT_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      retries: 4
    depends_on:
      event-ticket-service:
        condition: service_healthy
      payment-db:
        condition: service_healthy
    networks:
      - event-network
  event-gateway-service:
    build: ./gateway-service
    container_name: event-gateway-service
    ports:
      - "8888:8888"
    expose:
      - "8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://localhost:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://localhost:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - GATEWAY_CLIENT_SECRET=${GATEWAY_CLIENT_SECRET}
    depends_on:
      event-config-service:
        condition: service_healthy
    networks:
      - event-network


