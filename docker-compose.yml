services:
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: true
      KC_HTTP_ENABLED: true

    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - event-network

  event-discovery-service:
    build: ./discovery-service
    container_name: event-discovery-service
    ports:
      - "8761:8761"
    expose:
      - "8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks:
      - event-network
  event-config-service:
    build: ./config-service
    container_name: event-config-service
    ports:
      - "9999:9999"
    expose:
      - "9999"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9999/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      event-discovery-service:
        condition: service_healthy
    networks:
      - event-network
  event-event-service:
    build: ./event-service
    container_name: event-event-service
    ports:
      - "8082:8082"
    expose:
      - "8082"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - EVENT_SERVICE_CLIENT_SECRET=${EVENT_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 90s
    depends_on:
      event-config-service:
        condition: service_healthy
      event-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - event-network
  event-ticket-service:
    build: ./ticket-service
    container_name: event-ticket-service
    ports:
      - "8083:8083"
    expose:
      - "8083"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - TICKET_SERVICE_CLIENT_SECRET=${TICKET_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 90s
    depends_on:
      event-event-service:
        condition: service_healthy
      ticket-db:
        condition: service_healthy
    networks:
      - event-network
  event-payment-service:
    build: ./payment-service
    container_name: event-payment-service
    ports:
      - "8084:8084"
    expose:
      - "8084"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - PAYMENT_SERVICE_CLIENT_SECRET=${PAYMENT_SERVICE_CLIENT_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 4
      start_period: 90s
    depends_on:
      event-ticket-service:
        condition: service_healthy
      payment-db:
        condition: service_healthy
    networks:
      - event-network
  event-gateway-service:
    build: ./gateway-service
    container_name: event-gateway-service
    ports:
      - "8888:8888"
    expose:
      - "8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://event-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://event-config-service:9999
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/event-platform-realm
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/event-platform-realm/protocol/openid-connect/certs
      - GATEWAY_CLIENT_SECRET=${GATEWAY_CLIENT_SECRET}
    depends_on:
      event-config-service:
        condition: service_healthy
    networks:
      - event-network
  event-db:
    image: postgres:15-alpine
    container_name: event-db
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d eventdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - event-network

  ticket-db:
    image: postgres:15-alpine
    container_name: ticket-db
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticketdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - event-network

  payment-db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - event-network

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - event-network

volumes:
  keycloak-db-data:
    driver: local
  event-db-data:
    driver: local
  ticket-db-data:
    driver: local
  payment-db-data:
    driver: local

networks:
  event-network:
    driver: bridge
