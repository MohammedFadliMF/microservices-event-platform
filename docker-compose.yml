  event-db:
    image: postgres:15-alpine
    container_name: event-db
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d eventdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - event-network

  ticket-db:
    image: postgres:15-alpine
    container_name: ticket-db
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ticketdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - event-network

  payment-db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d paymentdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - event-network

volumes:
#  user-db-data:
#    driver: local
  event-db-data:
    driver: local
  ticket-db-data:
    driver: local
  payment-db-data:
    driver: local

networks:
  event-network:
    driver: bridge