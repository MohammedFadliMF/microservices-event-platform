spring:
  application:
    name: gateway-service
  cloud:
    config:
      uri: ${CONFIG_SERVICE_URL:http://localhost:9999}
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            Path=/api/users/**
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            Path=/api/events/**
        - id: ticket-service
          uri: lb://TICKET-SERVICE
          predicates:
            Path=/api/tickets/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            Path=/api/payments/**


