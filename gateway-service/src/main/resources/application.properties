spring.application.name=gateway-service
server.port=8888
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}
spring.main.allow-bean-definition-overriding=true

# OAuth2 Resource Server (JWT Token Validation from Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/event-platform-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/event-platform-realm/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256

# Logs pour déboguer
logging.level.org.springframework.security.oauth2.client=DEBUG
logging.level.org.springframework.security.oauth2.resourceserver=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

